name: Build Watermelon DDNS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend
        working-directory: app
        run: npm ci

      - name: Build (vite + tauri)
        working-directory: app
        run: |
          npm run build
          npm run tauri build -- ${{ matrix.target == 'universal-apple-darwin' && '--target universal-apple-darwin' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.target }}
          path: |
            app/src-tauri/target/**/bundle/**
            app/src-tauri/target/**/Watermelon*.dmg
            app/src-tauri/target/**/Watermelon*.msi
            app/src-tauri/target/**/Watermelon*.exe
          if-no-files-found: warn

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (app)
        working-directory: app
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: npm audit (server)
        working-directory: server
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: cargo audit
        working-directory: app/src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
        continue-on-error: true
